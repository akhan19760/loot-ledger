<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // Apply a saved light theme before first paint (see src/hooks/use-theme.ts).
      try {
        if (localStorage.getItem("lootledger-theme") === "light") {
          document.documentElement.classList.remove("dark")
          document.querySelector('meta[name="theme-color"]').content = "#f1f1ec"
        }
      } catch {}
    </script>
    <meta name="description" content="LootLedger: compare new and used PlayStation game prices across Pakistani game stores in one place." />
    <title>LootLedger</title>
    <!-- Link previews for the site; a game's share link (/g/<game>) has its own, served by the API -->
    <meta property="og:site_name" content="LootLedger" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LootLedger" />
    <meta property="og:description" content="Compare new and used PlayStation game prices across Pakistani game stores in one place." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
