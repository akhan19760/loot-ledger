<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4FF9E"/>
      <stop offset="0.5" stop-color="#E2FF4A"/>
      <stop offset="1" stop-color="#D4FB08"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE300"/>
      <stop offset="1" stop-color="#859E00"/>
    </linearGradient>
  </defs>

  <!-- faint glow so the cursor reads on dark backgrounds -->
  <path d="M3 3 Q30 9 50 22 Q38 20 30 26 L50 46 L60 60 L46 50 L26 30 Q20 38 22 50 Q9 30 3 3 Z"
        fill="none" stroke="#D4FB08" stroke-opacity="0.25" stroke-width="5" stroke-linejoin="round"/>

  <!-- upper half: lit wing -->
  <path d="M3 3 Q30 9 50 22 Q38 20 30 26 L50 46 L60 60 Z" fill="url(#top)"/>
  <!-- lower half: shaded wing -->
  <path d="M3 3 L60 60 L46 50 L26 30 Q20 38 22 50 Q9 30 3 3 Z" fill="url(#bottom)"/>

  <!-- inner wing panels -->
  <path d="M26 15 L46 22 Q38 21.5 31 25 Z" fill="#B5D600"/>
  <path d="M15 26 L22 46 Q21.5 38 25 31 Z" fill="#6E8300"/>
  <path d="M26 15 L46 22" stroke="#1B2000" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M15 26 L22 46" stroke="#1B2000" stroke-width="1.2" stroke-linecap="round"/>

  <!-- leading-edge highlight -->
  <path d="M9 6.3 Q26 10 40 16.5" fill="none" stroke="#FBFFD9" stroke-width="1.6" stroke-linecap="round"/>

  <!-- center groove + gem -->
  <path d="M9 9 L38 38" stroke="#1B2000" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M22 17.5 L26.5 22 L22 26.5 L17.5 22 Z" fill="#1B2000"/>
  <path d="M22 19.6 L24.4 22 L22 24.4 L19.6 22 Z" fill="#F4FF9E"/>

  <!-- shaft collar -->
  <path d="M40 36 L43 39 L39 43 L36 40 Z" fill="#1B2000"/>

  <!-- tail highlight -->
  <path d="M47 43.5 L55.5 54" stroke="#F4FF9E" stroke-width="1.4" stroke-linecap="round"/>

  <!-- outline -->
  <path d="M3 3 Q30 9 50 22 Q38 20 30 26 L50 46 L60 60 L46 50 L26 30 Q20 38 22 50 Q9 30 3 3 Z"
        fill="none" stroke="#1B2000" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
